<!-- index.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Primary SEO -->
    <title>Sanu Builds — Premium 240+ GSM Heavyweight T-Shirts</title>

    <meta
      name="description"
      content="Shop Sanu Builds premium 240+ GSM heavyweight T-shirts in India. Built for modern creators, engineers, developers, and builders."
    />

    <meta
      name="keywords"
      content="Sanu Builds, Sanu Builds T-shirts, heavyweight T-shirts, 240 GSM T-shirts, 240+ GSM T-shirts, premium T-shirts India, oversized T-shirts India, creator T-shirts, developer T-shirts, engineer T-shirts"
    />

    <meta name="author" content="Sanu Builds" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <meta name="theme-color" content="#ffffff" />

    <meta name="color-scheme" content="light" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sanubuilds.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:title"
      content="Sanu Builds — Premium 240+ GSM Heavyweight T-Shirts"
    />

    <meta
      property="og:description"
      content="Shop premium 240+ GSM heavyweight T-shirts from Sanu Builds. Built for modern creators, engineers, developers, and builders."
    />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Sanu Builds" />

    <meta property="og:url" content="https://sanubuilds.com/" />

    <meta
      property="og:image"
      content="https://sanubuilds.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="Sanu Builds Premium Heavyweight T-Shirts"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Sanu Builds — Premium Heavyweight T-Shirts"
    />

    <meta
      name="twitter:description"
      content="Premium 240+ GSM heavyweight T-shirts crafted for modern creators, engineers, developers, and builders."
    />

    <meta
      name="twitter:image"
      content="https://sanubuilds.com/og-image.jpg"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//fonts.gstatic.com"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Organization / Brand Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sanu Builds",
        "url": "https://sanubuilds.com/",
        "logo": "https://sanubuilds.com/favicon.png"
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sanu Builds",
        "url": "https://sanubuilds.com/",
        "description": "Sanu Builds premium 240+ GSM heavyweight T-shirts for modern creators, engineers, developers, and builders.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://sanubuilds.com/shop?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <style>
      html {
        background: #ffffff;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #ffffff;
        font-family:
          'Plus Jakarta Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      ::selection {
        background: #171717;
        color: #ffffff;
      }
    </style>
  </head>

  <body
    class="bg-white text-neutral-900 antialiased selection:bg-neutral-950 selection:text-white"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
